<svg viewBox="0 0 840 230" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E85D3D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E85D3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="840" height="230" rx="14" fill="#131110"/>
  <rect x="0.5" y="0.5" width="839" height="229" rx="14" fill="none" stroke="#2c2926"/>

  <!-- edges -->
  <g stroke="#3a3630" stroke-width="1.2" fill="none">
    <path id="e1" d="M 175 115 C 300 40, 420 34, 560 34"/>
    <path id="e2" d="M 175 115 C 300 78, 420 74, 560 74"/>
    <path id="e3" d="M 175 115 C 320 115, 430 115, 560 115"/>
    <path id="e4" d="M 175 115 C 300 152, 420 156, 560 156"/>
    <path id="e5" d="M 175 115 C 300 190, 420 196, 560 196"/>
  </g>

  <!-- outbound work: ember pulses -->
  <g fill="#E85D3D">
    <circle r="3.2"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0s"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3.2"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.5s"><mpath href="#e2"/></animateMotion></circle>
    <circle r="3.2"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1s"><mpath href="#e3"/></animateMotion></circle>
    <circle r="3.2"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.5s"><mpath href="#e4"/></animateMotion></circle>
    <circle r="3.2"><animateMotion dur="2.6s" repeatCount="indefinite" begin="2s"><mpath href="#e5"/></animateMotion></circle>
  </g>

  <!-- returning evidence: green pulses -->
  <g fill="#3fae8a">
    <circle r="2.6"><animateMotion dur="3.1s" repeatCount="indefinite" begin="1.3s" keyPoints="1;0" keyTimes="0;1"><mpath href="#e1"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="3.1s" repeatCount="indefinite" begin="2.1s" keyPoints="1;0" keyTimes="0;1"><mpath href="#e3"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="3.1s" repeatCount="indefinite" begin="0.4s" keyPoints="1;0" keyTimes="0;1"><mpath href="#e5"/></animateMotion></circle>
  </g>

  <!-- orchestrator -->
  <circle cx="175" cy="115" r="46" fill="url(#glow)">
    <animate attributeName="r" values="42;52;42" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="175" cy="115" r="26" fill="#131110" stroke="#E85D3D" stroke-width="2"/>
  <text x="175" y="120" text-anchor="middle" fill="#f5efe6" font-size="13" font-weight="bold">me</text>
  <text x="175" y="176" text-anchor="middle" fill="#8a837a" font-size="10" letter-spacing="2">ORCHESTRATE</text>

  <!-- agents -->
  <g>
    <circle cx="560" cy="34" r="7" fill="#131110" stroke="#E85D3D" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="38" fill="#f5efe6" font-size="12">research swarm</text>
    <circle cx="560" cy="74" r="7" fill="#131110" stroke="#E85D3D" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="78" fill="#f5efe6" font-size="12">adversarial verifiers</text>
    <circle cx="560" cy="115" r="7" fill="#131110" stroke="#E85D3D" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="119" fill="#f5efe6" font-size="12">source-locked curation</text>
    <circle cx="560" cy="156" r="7" fill="#131110" stroke="#E85D3D" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="160" fill="#f5efe6" font-size="12">overnight builds</text>
    <circle cx="560" cy="196" r="7" fill="#131110" stroke="#E85D3D" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="200" fill="#f5efe6" font-size="12">ship to prod</text>
  </g>

  <!-- footer -->
  <text x="24" y="215" fill="#5c564e" font-size="10" letter-spacing="1">AGENTS PROPOSE · EVIDENCE DECIDES</text>
</svg>
