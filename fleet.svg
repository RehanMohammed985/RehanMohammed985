<svg viewBox="0 0 840 250" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E85D3D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E85D3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="840" height="250" rx="14" fill="#131110"/>
  <rect x="0.5" y="0.5" width="839" height="249" rx="14" fill="none" stroke="#2c2926"/>

  <!-- edges -->
  <g stroke="#3a3630" stroke-width="1.2" fill="none">
    <path id="e1" d="M 175 125 C 300 30, 420 26, 560 26"/>
    <path id="e2" d="M 175 125 C 300 62, 420 58, 560 58"/>
    <path id="e3" d="M 175 125 C 310 92, 430 90, 560 90"/>
    <path id="e4" d="M 175 125 C 320 125, 430 125, 560 125"/>
    <path id="e5" d="M 175 125 C 310 158, 430 160, 560 160"/>
    <path id="e6" d="M 175 125 C 300 188, 420 192, 560 192"/>
    <path id="e7" d="M 175 125 C 300 218, 420 224, 560 224" stroke-dasharray="4 4"/>
  </g>

  <!-- outbound work: ember pulses -->
  <g fill="#E85D3D">
    <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite" begin="0s"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite" begin="0.4s"><mpath href="#e2"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite" begin="0.8s"><mpath href="#e3"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite" begin="1.2s"><mpath href="#e4"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite" begin="1.6s"><mpath href="#e5"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite" begin="2s"><mpath href="#e6"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite" begin="2.4s"><mpath href="#e7"/></animateMotion></circle>
  </g>

  <!-- returning evidence: green pulses -->
  <g fill="#3fae8a">
    <circle r="2.5"><animateMotion dur="3.3s" repeatCount="indefinite" begin="1.3s" keyPoints="1;0" keyTimes="0;1"><mpath href="#e2"/></animateMotion></circle>
    <circle r="2.5"><animateMotion dur="3.3s" repeatCount="indefinite" begin="2.2s" keyPoints="1;0" keyTimes="0;1"><mpath href="#e4"/></animateMotion></circle>
    <circle r="2.5"><animateMotion dur="3.3s" repeatCount="indefinite" begin="0.5s" keyPoints="1;0" keyTimes="0;1"><mpath href="#e6"/></animateMotion></circle>
  </g>

  <!-- orchestrator -->
  <circle cx="175" cy="125" r="46" fill="url(#glow)">
    <animate attributeName="r" values="42;52;42" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="175" cy="125" r="26" fill="#131110" stroke="#E85D3D" stroke-width="2"/>
  <text x="175" y="130" text-anchor="middle" fill="#f5efe6" font-size="13" font-weight="bold">me</text>
  <text x="175" y="186" text-anchor="middle" fill="#8a837a" font-size="10" letter-spacing="2">ORCHESTRATE</text>

  <!-- agents -->
  <g>
    <circle cx="560" cy="26" r="7" fill="#131110" stroke="#E85D3D" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="30" fill="#f5efe6" font-size="12">research swarms</text>
    <circle cx="560" cy="58" r="7" fill="#131110" stroke="#E85D3D" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="62" fill="#f5efe6" font-size="12">adversarial verifiers</text>
    <circle cx="560" cy="90" r="7" fill="#131110" stroke="#E85D3D" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.8s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="94" fill="#f5efe6" font-size="12">data pipelines</text>
    <circle cx="560" cy="125" r="7" fill="#131110" stroke="#E85D3D" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.8s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="129" fill="#f5efe6" font-size="12">drones &amp; hardware</text>
    <circle cx="560" cy="160" r="7" fill="#131110" stroke="#E85D3D" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.8s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="164" fill="#f5efe6" font-size="12">autonomous builds</text>
    <circle cx="560" cy="192" r="7" fill="#131110" stroke="#E85D3D" stroke-width="1.6">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.8s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="196" fill="#f5efe6" font-size="12">distribution</text>
    <circle cx="560" cy="224" r="7" fill="#131110" stroke="#8a837a" stroke-width="1.6" stroke-dasharray="3 3">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.8s" begin="2.9s" repeatCount="indefinite"/>
    </circle>
    <text x="578" y="228" fill="#8a837a" font-size="12" font-style="italic">whatever's next</text>
  </g>

  <!-- footer -->
  <text x="24" y="236" fill="#5c564e" font-size="10" letter-spacing="1">AGENTS PROPOSE · EVIDENCE DECIDES</text>
</svg>
