<svg viewBox="0 0 840 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <!-- One 10s loop: run `runtape why`, rerun without each piece of context, find the cause, write the fix test. -->
  <defs>
    <clipPath id="type1"><rect x="40" y="56" height="22" width="0">
      <animate attributeName="width" dur="10s" repeatCount="indefinite"
        values="0;0;330;330;0" keyTimes="0;0.03;0.14;0.97;1"/></rect></clipPath>
    <clipPath id="type2"><rect x="40" y="246" height="22" width="0">
      <animate attributeName="width" dur="10s" repeatCount="indefinite"
        values="0;0;600;600;0" keyTimes="0;0.70;0.82;0.97;1"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect width="840" height="300" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="839" height="299" rx="12" fill="none" stroke="#30363d"/>
  <circle cx="22" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="5" fill="#febc2e"/>
  <circle cx="58" cy="20" r="5" fill="#28c840"/>
  <text x="420" y="24" text-anchor="middle" fill="#8b949e" font-size="12">runtape — why did my agent forward that invoice?</text>
  <line x1="0" y1="38" x2="840" y2="38" stroke="#21262d"/>

  <!-- 1. command -->
  <g clip-path="url(#type1)">
    <text x="40" y="72" fill="#c9d1d9"><tspan fill="#3fb950">$</tspan> runtape why last tool:forward_email</text>
  </g>

  <!-- 2. status -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.17;0.19;0.97;1"/>
    <text x="40" y="100" fill="#8b949e">rerunning the decision without each piece of context …</text>
    <text x="56" y="126" fill="#6e7681" font-size="11">CONTEXT PIECE</text>
    <text x="376" y="126" fill="#6e7681" font-size="11">EFFECT</text>
    <text x="620" y="126" fill="#6e7681" font-size="11">FORWARDS WITHOUT IT</text>
  </g>

  <!-- 3. rows: name, effect bar, result -->
  <g>
    <g opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.22;0.24;0.97;1"/>
      <text x="56" y="150" fill="#c9d1d9">system prompt</text>
      <rect x="376" y="141" width="200" height="10" rx="2" fill="#161b22"/>
      <rect x="376" y="141" width="4" height="10" rx="2" fill="#484f58"/>
      <text x="620" y="150" fill="#8b949e">10/10</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.28;0.30;0.97;1"/>
      <text x="56" y="172" fill="#c9d1d9">user message</text>
      <rect x="376" y="163" width="200" height="10" rx="2" fill="#161b22"/>
      <rect x="376" y="163" width="20" height="10" rx="2" fill="#484f58"/>
      <text x="620" y="172" fill="#8b949e">9/10</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.34;0.36;0.97;1"/>
      <text x="56" y="194" fill="#c9d1d9">tool result: search_inbox</text>
      <rect x="376" y="185" width="200" height="10" rx="2" fill="#161b22"/>
      <rect x="376" y="185" width="4" height="10" rx="2" fill="#484f58"/>
      <text x="620" y="194" fill="#8b949e">10/10</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.40;0.42;0.97;1"/>
      <text x="56" y="216" fill="#c9d1d9">vendor email · <tspan fill="#f78166">&lt;!-- hidden comment --&gt;</tspan></text>
      <rect x="376" y="207" width="200" height="10" rx="2" fill="#161b22"/>
      <rect x="376" y="207" width="0" height="10" rx="2" fill="#f78166">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;200;200;0" keyTimes="0;0.42;0.50;0.97;1"/>
      </rect>
      <text x="620" y="216" fill="#f78166" font-weight="bold">0/10</text>
      <g opacity="0">
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.52;0.54;0.97;1"/>
        <text x="680" y="216" fill="#f78166">← cause  p=5e-6</text>
      </g>
    </g>
    <!-- highlight sweep over the culprit row -->
    <rect x="44" y="200" width="780" height="22" rx="4" fill="#f78166" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.12;0.06;0.06;0" keyTimes="0;0.52;0.56;0.62;0.97;1"/>
    </rect>
  </g>

  <!-- 4. fix -->
  <g clip-path="url(#type2)">
    <text x="40" y="262" fill="#c9d1d9"><tspan fill="#3fb950">$</tspan> runtape fix last tool:forward_email --write-test tests/test_inbox.py</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.85;0.87;0.97;1"/>
    <text x="40" y="282" fill="#3fb950" font-size="12">✓ fix holds 10/10 · regression test written</text>
  </g>

</svg>
